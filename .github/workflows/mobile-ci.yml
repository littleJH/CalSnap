name: Mobile CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".nvmrc"
      - ".github/workflows/mobile-ci.yml"
  push:
    paths:
      - "mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".nvmrc"
      - ".github/workflows/mobile-ci.yml"

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Flutter pub get
        run: pnpm --filter ./mobile bootstrap

      - name: Analyze
        run: pnpm --filter ./mobile analyze

      - name: Test
        run: pnpm --filter ./mobile test

      - name: Build
        run: pnpm --filter ./mobile build
